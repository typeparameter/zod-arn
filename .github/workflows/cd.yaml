name: CD
on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: pnpm/setup@v3
        with:
          version: latest
          cache: true
      - run: npm audit signatures
      - run: pnpx semantic-release@25
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
