name: CI
on: [pull_request]

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: latest
          runtime: node@26
          cache: true
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format:check
